<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mishnah.Online – Word-by-word Mishnah study with translation and roots</title>
    <meta name="description" content="Read and study the Mishnah with word-by-word contextual translations, grammatical parsing, and Hebrew roots across all 63 tractates." />
    <link rel="canonical" href="https://mishnah.online" />

    <!-- Theme & Icons -->
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B2442" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / WhatsApp / iMessage -->
    <meta property="og:site_name" content="Mishnah.Online" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mishnah.online" />
    <meta property="og:title" content="Mishnah.Online – Word-by-word Mishnah study with translation and roots" />
    <meta property="og:description" content="Read and study the Mishnah with word-by-word contextual translations, grammatical parsing, and Hebrew roots across all 63 tractates." />
    <meta property="og:image" content="https://mishnah.online/og-image.png" />
    <meta property="og:image:secure_url" content="https://mishnah.online/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mishnah.Online – Word-by-word Mishnah study with translation and roots" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mishnah.online" />
    <meta name="twitter:title" content="Mishnah.Online – Word-by-word Mishnah study with translation and roots" />
    <meta name="twitter:description" content="Read and study the Mishnah with word-by-word contextual translations, grammatical parsing, and Hebrew roots across all 63 tractates." />
    <meta name="twitter:image" content="https://mishnah.online/og-image.png" />
    <meta name="twitter:image:alt" content="Mishnah.Online – Word-by-word Mishnah study with translation and roots" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Mishnah.Online",
      "alternateName": ["Mishnah Online", "משנה אונליין"],
      "url": "https://mishnah.online",
      "description": "Read and study the Mishnah with word-by-word contextual translations, grammatical parsing, and Hebrew roots across all 63 tractates.",
      "inLanguage": ["en", "he"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://mishnah.online/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Fonts Preconnect & Async Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=David+Libre:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=David+Libre:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=David+Libre:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body class="bg-[#faf7f2] text-slate-900 antialiased selection:bg-amber-100 selection:text-amber-950 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
